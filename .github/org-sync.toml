homepage = ""
topics = ["claude-code", "claude-code-plugin", "agent-skills", "ai-agents", "automation", "swarm-intelligence"]
ruleset = "tooling"
required_checks = ["plugins", "python / python", "headers / licence", "check / org-sync", "title / title"]
