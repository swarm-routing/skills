name: Licence

# All of this repository is tooling, so every source file is MIT OR GPL-2.0-only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@main
    with:
      dual-roots: plugins/ tools/ .github/
      core-roots: ''
