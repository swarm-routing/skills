name: CI

# The marketplace and every plugin manifest, SKILL.md and eval grader validate;
# the skill wrappers and the script graders pass shellcheck; the workflows pass
# actionlint; tools/ passes ruff and its self-tests run under coverage
# (report-only, swarm-routing/.github#35). Licence headers and the org-sync
# drift check run in their own workflows (licence.yml, org-sync.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make test (marketplace, plugin.json, SKILL.md frontmatter, + self-test)
        run: make test
      - name: lint (actionlint, shellcheck on the skill wrappers and script graders)
        run: |
          pip install --quiet actionlint-py==1.7.12.25 shellcheck-py==0.10.0.1
          actionlint .github/workflows/*.yml
          find skills \( -path '*/scripts/*' -o -path '*/graders/*.sh' \) -type f -print0 | xargs -0 -r shellcheck

  python:
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      paths: tools
      tests: tools/checks/test_check_plugins.py tools/evals/test_grade.py
      source: tools
