name: CI

# The marketplace and every plugin manifest, SKILL.md and eval grader validate;
# the skill wrappers, the MCP launcher and the script graders pass shellcheck; the workflows pass
# actionlint; tools/ passes ruff and its self-tests run under coverage
# (report-only, swarm-routing/.github#35). Licence headers and the org-sync
# drift check run in their own workflows (licence.yml, org-sync.yml).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make test (marketplace, plugin.json, SKILL.md frontmatter, + self-test)
        run: make test
      - name: lint (actionlint, shellcheck on the skill wrappers, the MCP launcher and script graders)
        timeout-minutes: 5  # the two downloads (org CONTRIBUTING invariant 5)
        env:
          # actionlint 1.7.12's own release, checked against its sha256 (the release's
          # checksums.txt): actionlint-py has no wheel, and its sdist runs a setup script
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # the hash-pinned lock of tools/requirements/ci.in (swarm-routing/.github#716)
          pip install --quiet --only-binary :all: --require-hashes -r tools/requirements/ci.txt
          curl --proto =https --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
          find skills tools/mcp \( -path '*/scripts/*' -o -path '*/graders/*.sh' -o -path 'tools/mcp/*' \) -type f -print0 | xargs -0 -r shellcheck

  python:
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@7da75079f90de51edbee403a28811537981a359a # main@2026-11-26
    with:
      paths: tools
      tests: tools/checks/test_check_plugins.py tools/evals/test_grade.py tools/token-audit/test_token_audit.py tools/tracker-responses/test_responses.py tools/checks/test_mcp_launcher.py
      source: tools

  # The Python coverage of the `python` job to Codecov (report-only; GitHub
  # OIDC, no stored token; swarm-routing/.github#635). Not in the merge queue:
  # main's push uploads it.
  codecov:
    needs: python
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@7da75079f90de51edbee403a28811537981a359a # main@2026-11-26
    with:
      artifact: python-coverage
      flags: python
