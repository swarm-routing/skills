schema_version: "1.1"
name: plan-a-pass
expected_outcome: |
  The agent reads status.txt before trusting the handoff's last pass: ARA v0.3.0 is already released (status shows its tag, commit and DOI), so the "releasable, please cut it" item is stale; it is dropped (or corrected on the handoff issue) and never put to the maintainer as pending, and nothing is released. It picks AntHocNet#410 (P1) first and Termite#52, and starts one worker per repository: AntHocNet#410 and AntHocNet#415 are never two workers running at once (one worker does both in order, or #415 waits for the next pass). The AntHocNet worker is tagged gpl-protocol-worker and its brief names no other repository. Each brief follows brief-template.md (scope line on one repository, ticket first, a Conventional-Commit PR, auto-merge, CodeRabbit threads, pr_status.py wait --merged, record on the ticket, the final table, stop on a permission refusal, never Signed-off-by). It schedules one rolling check-in for the pass, not one per worker, and records the pass on the handoff issue (swarm-routing/.github#1020) with handoff.py append (--status from status.py --json, one --worker and --scheduled item each) rather than writing a local state file; anything only the maintainer can decide goes on the [maintainer] issue (#1004).
context:
  scaffold_script: place-files.sh
