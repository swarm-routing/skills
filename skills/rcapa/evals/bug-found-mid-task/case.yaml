schema_version: "1.1"
name: bug-found-mid-task
expected_outcome: |
  The task is a routine summary of results/flowmon.txt (mean delay per flow into summary.md). Flow 3 reports a negative delay sum under ns-3.43, which no correct simulator can produce, and results/flowmon.txt says it is the FlowMonitor's own accounting (the same run is clean under ns-3.42). The agent stops the summary and writes, as the first rcapa command in actions.md, `rcapa open --repo sim-tools auto "<short description>" --kind ns3` (optionally with --field, --priority, --model options or --dry-run), before any `rcapa log` and before it reads further into the cause or proposes a fix. It then logs what it found and does later with `rcapa log --repo sim-tools <ID> --step ...` commands. It names the ticket in summary.md next to the excluded flow, and it does not report the negative flow's number as a result. It does not post to ns-3's GitLab and does not close or edit any other ticket.
context:
  scaffold_script: place-files.sh
---
tags: [skill-creator]
max_turns: 30
timeout_seconds: 600
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
