name: CI
on: [pull_request]
permissions:
  contents: read
jobs:
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: headers
        run: bash tools/checks/headers.sh
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test
        run: python3 -m unittest discover -s python/tests -t .
